<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OlympicsAnalytics{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}"><i class="fa-solid fa-medal text-gold"></i> OlympicsAnalytics</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#insights">Insights</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active=='d1' }}" href="{{ url_for('dashboard1') }}">Dashboard 1</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active=='d2' }}" href="{{ url_for('dashboard2') }}">Dashboard 2</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active=='story' }}" href="{{ url_for('story') }}">Story</a></li>
        <li class="nav-item ms-lg-3"><a class="btn btn-gold btn-sm" href="{{ url_for('dashboard1') }}">Explore Data</a></li>
      </ul>
    </div>
  </div>
</nav>
{% block content %}{% endblock %}
<footer class="py-4 text-center text-white-50">
  &copy; 2026 Global Olympic Sports Performance Analysis &middot; Built with Tableau &amp; Flask
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
