{% extends "base.html" %}
{% block title %}Olympic Story{% endblock %}
{% block content %}
<main class="page-top container-fluid px-lg-5">
  <h2 class="text-white">The Olympic Performance Story</h2>
  <p class="text-white-50">Click through the story points to follow the narrative from global medal trends to regional efficiency.</p>
  <div class="viz-wrap">
    <tableau-viz id="tableauStory" src="{{ url }}" width="100%" height="900"
                 toolbar="bottom" device="desktop"></tableau-viz>
  </div>
</main>
<script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
{% endblock %}
